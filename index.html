    <style>
        :root {
            --bg-dark: #0b080d;
            --surface: rgba(255, 255, 255, 0.035);
            --surface-border: rgba(255, 255, 255, 0.09);
            --text-main: #f8f4f7;
            --text-muted: #a698a3;
            --accent: #ff4d7d;
            --accent-glow: rgba(255, 77, 125, 0.45);
            --gold: #f5c28c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.4;
            animation: floatOrb 22s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, #ff2a6d 0%, transparent 70%);
            top: -15%;
            left: -10%;
        }

        .orb-2 {
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, #7928ca 0%, transparent 70%);
            bottom: -15%;
            right: -10%;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, #ff758c 0%, transparent 70%);
            top: 40%;
            left: 35%;
            opacity: 0.22;
            animation-delay: -14s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 8%) scale(1.08); }
            100% { transform: translate(-4%, -6%) scale(0.95); }
        }

        .grain-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            z-index: 1000;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: width 0.1s ease-out;
        }

        .top-bar {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 900;
            background: rgba(18, 13, 22, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            padding: 10px 22px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .top-bar .badge {
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.72rem;
        }

        .top-bar .divider {
            width: 1px;
            height: 14px;
            background: var(--surface-border);
        }

        .top-bar .counter {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .hero {
            min-height: 92vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 60px;
            position: relative;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(255, 77, 125, 0.12);
            border: 1px solid rgba(255, 77, 125, 0.3);
            color: #ff94b2;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 28px;
            animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(3.2rem, 8vw, 6.2rem);
            font-weight: 700;
            line-height: 0.98;
            letter-spacing: -0.02em;
            max-width: 900px;
            background: linear-gradient(135deg, #ffffff 15%, #ffd1df 55%, #f5c28c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-muted);
            max-width: 560px;
            line-height: 1.65;
            margin-bottom: 44px;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .scroll-cue {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
        }

        .scroll-line {
            width: 1px;
            height: 48px;
            background: linear-gradient(to bottom, var(--accent), transparent);
            animation: pulseLine 2s infinite ease-in-out;
        }

        @keyframes pulseLine {
            0%, 100% { transform: scaleY(0.6); opacity: 0.4; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(32px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 1160px;

        .chapter {

        .chapter.visible {
            opacity: 1;
            transform: translateY(0) scale(1);

            color: #fff;
            line-height: 1.15;
            margin-top: 4px;

        .photos-grid {
            display: grid;
            gap: 22px;
            perspective: 1200px;
        }

        .photos-grid.cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .photos-grid.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .tilt-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 3 / 4;
            background: #17121b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: zoom-in;
            transform-style: preserve-3d;
            transition: transform 0.25s cubic-bezier(0.03, 0.98, 0.52, 0.99),

            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .tilt-card:hover {
            box-shadow: 0 22px 45px rgba(255, 77, 125, 0.22);
            z-index: 5;
        }

        .tilt-card .glare {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.25), transparent 65%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            mix-blend-mode: overlay;
            z-index: 2;
        }

        .tilt-card:hover .glare {
            opacity: 1;
        }

        .tilt-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tilt-card img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .tilt-card:hover img.loaded {
            transform: scale(1.04);
        }

            right: 12px;

            font-size: 1rem;

            font-size: 0.85rem;

            margin-top: 4px;

            top: 50%;

            height: 48px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 2010;

        .lb-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .lb-prev { left: 20px; }
        .lb-next { right: 20px; }

        .lb-close {
            position: fixed;
            top: 22px;
            right: 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 2010;
            transition: all 0.2s ease;
        }

        .lb-close:hover {
            background: var(--accent);
        }

        footer {
            text-align: center;
            padding: 40px 20px 60px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        footer span {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .chapter {
                padding: 22px;
                margin-bottom: 44px;
                border-radius: 24px;
            }
            .photos-grid.cols-3 {
                grid-template-columns: repeat(2, 1fr);
            }
            .photos-grid.cols-3 .tilt-card:last-child {
                grid-column: span 2;
                aspect-ratio: 4 / 3;
            }
            .lb-btn {
                width: 40px;
                height: 40px;
            }
        }

        @media (max-width: 480px) {
            .photos-grid.cols-2,
            .photos-grid.cols-3 {
                grid-template-columns: 1fr;
            }
            .photos-grid.cols-3 .tilt-card:last-child {
                grid-column: span 1;
                aspect-ratio: 3 / 4;
            }
        }
    </style>
</head>

        function attachTiltEffect(card) {
            const glare = card.querySelector('.glare');
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = ((y - centerY) / centerY) * -7;
                const rotateY = ((x - centerX) / centerX) * 7;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                glare.style.background = `radial-gradient(circle at ${(x / rect.width) * 100}% ${(y / rect.height) * 100}%, rgba(255,255,255,0.3), transparent 65%)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            });
        }

        function createPhotoCard(photoNumber, sectionTitle, sectionText) {
            const rawName = `01 (${photoNumber}).jpg`;
            const rawNameUpper = `01 (${photoNumber}).JPG`;
            const encName = encodeURIComponent(rawName);
            const encNameUpper = encodeURIComponent(rawNameUpper);

            const sources = [
                rawName,
                rawNameUpper,
                `https://raw.githubusercontent.com/${USER}/${REPO}/main/${encName}`,
                `https://raw.githubusercontent.com/${USER}/${REPO}/main/${encNameUpper}`,
                `https://raw.githubusercontent.com/${USER}/${REPO}/master/${encName}`,
                `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${encName}`
            ];

            const card = document.createElement('div');
            card.className = 'tilt-card';

            const glare = document.createElement('div');
            glare.className = 'glare';

            const badge = document.createElement('div');
            badge.className = 'photo-index';
            badge.textContent = `#${String(photoNumber).padStart(2, '0')}`;

            const img = document.createElement('img');
            img.loading = 'lazy';
            img.alt = sectionTitle;

            let attempt = 0;
            img.src = sources[attempt];

            img.onload = () => {
                img.classList.add('loaded');
                const entry = { src: img.src, title: sectionTitle, text: sectionText };
                const idx = loadedGallery.push(entry) - 1;
                card.onclick = () => openLightbox(idx);
            };

            img.onerror = () => {
                attempt++;
                if (attempt < sources.length) {
                    img.src = sources[attempt];
                } else {
                    card.remove();
                }
            };

            card.appendChild(glare);
            card.appendChild(img);
            card.appendChild(badge);
            attachTiltEffect(card);

            return card;
        }

        const chapterCounter = document.getElementById('chapterCounter');
        chapterCounter.textContent = `Глава 01 / ${sections.length}`;

        sections.forEach((sec, index) => {
            const chapterEl = document.createElement('article');
            chapterEl.className = 'chapter';
            chapterEl.dataset.chapter = `${String(index + 1).padStart(2, '0')} / ${sections.length}`;

            const headerEl = document.createElement('div');
            headerEl.className = 'chapter-header';
            headerEl.innerHTML = `
                <div>
                    <div class="chapter-num">Глава ${String(index + 1).padStart(2, '0')}</div>
                    <h2 class="chapter-title">${sec.title}</h2>
                </div>
            `;

            const gridEl = document.createElement('div');
            gridEl.className = `photos-grid cols-${sec.ids.length === 2 ? '2' : '3'}`;

            sec.ids.forEach(num => {
                gridEl.appendChild(createPhotoCard(num, sec.title, sec.text));
            });

            const footerEl = document.createElement('div');
            footerEl.className = 'chapter-footer';
            footerEl.innerHTML = `
                <p class="chapter-quote">«${sec.text}»</p>
                <span class="chapter-heart">♥</span>
            `;

            chapterEl.appendChild(headerEl);
            chapterEl.appendChild(gridEl);
            chapterEl.appendChild(footerEl);
            storiesContainer.appendChild(chapterEl);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    chapterCounter.textContent = `Глава ${entry.target.dataset.chapter}`;
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.chapter').forEach(ch => observer.observe(ch));

        const progressBar = document.getElementById('scrollProgress');
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            progressBar.style.width = `${progress}%`;
        }, { passive: true });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lbTitle = document.getElementById('lbTitle');
        const lbSub = document.getElementById('lbSub');

        function openLightbox(index) {
            if (!loadedGallery.length) return;
            currentLbIndex = (index + loadedGallery.length) % loadedGallery.length;
            const item = loadedGallery[currentLbIndex];
            lightboxImg.src = item.src;
            lbTitle.textContent = item.title;
            lbSub.textContent = item.text;
            lightbox.classList.add('open');
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
        }

        document.getElementById('lbClose').onclick = closeLightbox;
        document.getElementById('lbPrev').onclick = (e) => { e.stopPropagation(); openLightbox(currentLbIndex - 1); };
        document.getElementById('lbNext').onclick = (e) => { e.stopPropagation(); openLightbox(currentLbIndex + 1); };
        lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') openLightbox(currentLbIndex - 1);
            if (e.key === 'ArrowRight') openLightbox(currentLbIndex + 1);
        });
    </script>
</body>
</html>
