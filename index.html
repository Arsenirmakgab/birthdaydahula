<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Галерея</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #0d0d11;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 90%;
        }

        .ui h1 {
            font-size: 2rem;
            margin-bottom: 6px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .ui p {
            font-size: 0.9rem;
            opacity: 0.75;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            background: rgba(20, 20, 28, 0.85);
            padding: 16px 28px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.4s ease;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="ui">
        <h1>3D Галерея</h1>
        <p>Зажмите мышку или палец для вращения | Колёсико / щипок для масштаба</p>
    </div>

    <div id="loading">Загрузка фотографий: 0 / 64</div>
    <div id="canvas-container"></div>

    <script>
        const USER = 'Arsenirmakgab';
        const REPO = 'birthdaydahula';
        const TOTAL_PHOTOS = 64; // от 01 (1).jpg до 01 (64).jpg

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0d11, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4;
        controls.maxDistance = 30;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
        scene.add(ambientLight);

        const galleryGroup = new THREE.Group();
        scene.add(galleryGroup);

        // Общая геометрия для всех 64 карточек (экономит память GPU)
        const sharedGeometry = new THREE.PlaneGeometry(2.2, 2.9);

        // Генерируем строгий список от 01 (1).jpg до 01 (64).jpg
        const photoUrls = Array.from({ length: TOTAL_PHOTOS }, (_, i) => {
            const fileName = `01 (${i + 1}).jpg`;
            return `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${encodeURIComponent(fileName)}`;
        });

        // Функция сжатия картинки в текстуру, чтобы 64 фото не вешали браузер
        function loadOptimizedTexture(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxSize = 512; // оптимальное разрешение для 3D-карточек
                    let w = img.width;
                    let h = img.height;

                    if (w > maxSize || h > maxSize) {
                        if (w > h) {
                            h = Math.round((h * maxSize) / w);
                            w = maxSize;
                        } else {
                            w = Math.round((w * maxSize) / h);
                            h = maxSize;
                        }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    const texture = new THREE.CanvasTexture(canvas);
                    texture.minFilter = THREE.LinearFilter;
                    resolve(texture);
                };
                img.onerror = reject;
                img.src = url;
            });
        }

        async function initGallery() {
            const loadingEl = document.getElementById('loading');
            let loadedCount = 0;

            // Разбиваем 64 фото на 2 аккуратных яруса по 32 фото, чтобы всё поместилось перед глазами
            const rows = 2;
            const perRow = Math.ceil(TOTAL_PHOTOS / rows);
            const radius = 12.5;

            const tasks = photoUrls.map(async (url, index) => {
                try {
                    const texture = await loadOptimizedTexture(url);
                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.DoubleSide
                    });

                    const card = new THREE.Mesh(sharedGeometry, material);

                    const row = Math.floor(index / perRow);
                    const indexInRow = index % perRow;
                    const angle = (indexInRow / perRow) * Math.PI * 2 + (row * 0.1);

                    card.position.x = Math.sin(angle) * radius;
                    card.position.z = Math.cos(angle) * radius;
                    card.position.y = (row === 0 ? 1.75 : -1.75);
                    card.rotation.y = angle;

                    galleryGroup.add(card);
                } catch (e) {
                    console.warn('Пропущено фото:', url);
                } finally {
                    loadedCount++;
                    loadingEl.innerText = `Загрузка фотографий: ${loadedCount} / ${TOTAL_PHOTOS}`;
                    if (loadedCount === 1) {
                        // Как только первая фотка готова, делаем лоадер полупрозрачным, чтобы уже можно было крутить сцену
                        loadingEl.style.top = 'auto';
                        loadingEl.style.bottom = '20px';
                        loadingEl.style.transform = 'translateX(-50%)';
                        loadingEl.style.fontSize = '0.9rem';
                        loadingEl.style.padding = '8px 16px';
                    }
                    if (loadedCount >= TOTAL_PHOTOS) {
                        loadingEl.style.opacity = '0';
                        setTimeout(() => loadingEl.style.display = 'none', 400);
                    }
                }
            });

            await Promise.all(tasks);
        }

        function animate() {
            requestAnimationFrame(animate);
            galleryGroup.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        initGallery();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
