<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Галерея</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d11;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .ui-overlay h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .ui-overlay p {
            margin-top: 5px;
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
    <!-- Подключение Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Подключение OrbitControls для управления камерой -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1>3D Галерея</h1>
        <p>Зажмите левую кнопку мыши для вращения | Колесико для масштабирования</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0d11, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Добавление управления камерой (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00aaff, 2, 50);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        // 4. Список ссылок на фотографии
        // Замените эти ссылки на прямые URL ваших фотографий из GitHub (Raw ссылки)
        const photoUrls = [
            'https://picsum.photos/id/1015/600/800',
            'https://picsum.photos/id/1018/600/800',
            'https://picsum.photos/id/1025/600/800',
            'https://picsum.photos/id/1039/600/800',
            'https://picsum.photos/id/1050/600/800',
            'https://picsum.photos/id/1069/600/800'
        ];

        // 5. Создание группы для карусели с карточками
        const galleryGroup = new THREE.Group();
        scene.add(galleryGroup);

        const textureLoader = new THREE.TextureLoader();
        const radius = 4; // Радиус круга карусели
        const count = photoUrls.length;

        photoUrls.forEach((url, index) => {
            const texture = textureLoader.load(url);
            const geometry = new THREE.PlaneGeometry(2, 2.8);
            const material = new THREE.MeshStandardMaterial({
                map: texture,
                side: THREE.DoubleSide,
                roughness: 0.3
            });

            const card = new THREE.Mesh(geometry, material);

            // Расстановка по кругу
            const angle = (index / count) * Math.PI * 2;
            card.position.x = Math.sin(angle) * radius;
            card.position.z = Math.cos(angle) * radius;
            
            // Разворот карточки к центру
            card.rotation.y = angle;

            galleryGroup.add(card);
        });

        // 6. Анимация
        function animate() {
            requestAnimationFrame(animate);

            // Плавное вращение всей карусели
            galleryGroup.rotation.y += 0.003;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 7. Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
