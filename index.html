<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Галерея</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #0d0d11;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .ui h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .ui p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="ui">
        <h1>3D Галерея</h1>
        <p>Зажмите мышку для вращения | Колёсико для масштабирования</p>
    </div>

    <div id="loading">Загрузка фотографий...</div>
    <div id="canvas-container"></div>

    <script>
        const USER = 'Arsenirmakgab';
        const REPO = 'birthdaydahula';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0d11, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const galleryGroup = new THREE.Group();
        scene.add(galleryGroup);

        async function loadPhotosFromGitHub() {
            const apiUrl = `https://api.github.com/repos/${USER}/${REPO}/contents/`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Ошибка при получении данных от GitHub API');
                
                const files = await response.json();
                
                const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
                
                // Формируем безопасные URL через CDN jsDelivr с правильной кодировкой пробелов и скобок
                const photoUrls = files
                    .filter(file => file.type === 'file' && validExtensions.some(ext => file.name.toLowerCase().endsWith(ext)))
                    .map(file => `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${encodeURIComponent(file.name)}`);

                if (photoUrls.length === 0) {
                    document.getElementById('loading').innerText = 'Фотографии не найдены.';
                    return;
                }

                document.getElementById('loading').style.display = 'none';
                create3DGallery(photoUrls);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerText = 'Ошибка при загрузке фото.';
            }
        }

        function create3DGallery(urls) {
            const textureLoader = new THREE.TextureLoader();
            // Разрешаем Cross-Origin загрузку изображений
            textureLoader.setCrossOrigin('anonymous');

            const count = urls.length;
            const radius = Math.max(5, count * 0.45);

            urls.forEach((url, index) => {
                textureLoader.load(
                    url, 
                    (texture) => {
                        const geometry = new THREE.PlaneGeometry(2.4, 3.2);
                        const material = new THREE.MeshStandardMaterial({
                            map: texture,
                            side: THREE.DoubleSide,
                            roughness: 0.2
                        });

                        const card = new THREE.Mesh(geometry, material);

                        const angle = (index / count) * Math.PI * 2;
                        card.position.x = Math.sin(angle) * radius;
                        card.position.z = Math.cos(angle) * radius;
                        card.rotation.y = angle;

                        galleryGroup.add(card);
                    },
                    undefined,
                    (err) => {
                        console.error('Не удалось загрузить фото:', url);
                    }
                );
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            galleryGroup.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        loadPhotosFromGitHub();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
