<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Галерея</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #0a0a0f;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .ui-overlay h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .ui-overlay p {
            margin-top: 6px;
            font-size: 0.95rem;
            opacity: 0.7;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls для управления вращением мышью -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1>3D Интерактивная Галерея</h1>
        <p>Вращайте сцену мышью | Масштабируйте колёсиком</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. Создание сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a0f, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Управление камерой (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Ограничение наклона снизу

        // 3. Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 4. Ссылки на ваши фотографии из GitHub (Raw ссылки)
        // Замените эти ссылки на ваши собственного репозитория:
        const photoUrls = [
            'https://raw.githubusercontent.com/github/explore/main/topics/javascript/javascript.png',
            'https://raw.githubusercontent.com/github/explore/main/topics/html/html.png',
            'https://raw.githubusercontent.com/github/explore/main/topics/css/css.png',
            'https://raw.githubusercontent.com/github/explore/main/topics/python/python.png',
            'https://raw.githubusercontent.com/github/explore/main/topics/git/git.png'
        ];

        // 5. Группа для карточек и расстановка по кругу
        const galleryGroup = new THREE.Group();
        scene.add(galleryGroup);

        const textureLoader = new THREE.TextureLoader();
        const radius = 4.5;
        const count = photoUrls.length;

        photoUrls.forEach((url, index) => {
            textureLoader.load(
                url,
                (texture) => {
                    const geometry = new THREE.PlaneGeometry(2.2, 3);
                    const material = new THREE.MeshStandardMaterial({
                        map: texture,
                        side: THREE.DoubleSide,
                        roughness: 0.3
                    });

                    const card = new THREE.Mesh(geometry, material);

                    // Позиционирование по окружности
                    const angle = (index / count) * Math.PI * 2;
                    card.position.x = Math.sin(angle) * radius;
                    card.position.z = Math.cos(angle) * radius;

                    // Разворот лицевой стороной к центру
                    card.rotation.y = angle;

                    galleryGroup.add(card);
                },
                undefined,
                (err) => {
                    console.error('Не удалось загрузить изображение:', url);
                }
            );
        });

        // 6. Анимационный цикл
        function animate() {
            requestAnimationFrame(animate);

            // Медленное автоматическое вращение галереи
            galleryGroup.rotation.y += 0.002;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 7. Поддержка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
