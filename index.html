<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши моменты ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffe6ee 0%, #ffd6e4 100%);
            color: #4a2535;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            min-height: 100vh;
            padding: 40px 20px 80px;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            color: #d6336c;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #7a495c;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(214, 51, 108, 0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: zoom-in;
            overflow: hidden;
            aspect-ratio: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 35px rgba(214, 51, 108, 0.22);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
            display: block;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card img.loaded {
            opacity: 1;
        }

        /* Полноэкранный просмотр по клику */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(25, 10, 18, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            cursor: zoom-out;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 90vh;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Наши моменты ❤️</h1>
        <p class="subtitle">64 любимых кадра</p>
    </header>

    <main class="gallery" id="gallery"></main>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
    <img id="lightboxImg" src="" alt="">
</div>

<script>
    const USER = 'Arsenirmakgab';
    const REPO = 'birthdaydahula';
    const TOTAL = 64; // от 01 (1).jpg до 01 (64).jpg

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    for (let i = 1; i <= TOTAL; i++) {
        const fileName = `01 (${i}).jpg`;
        const encoded = encodeURIComponent(fileName);

        // Цепочка запасных ссылок: сначала локально из папки, затем GitHub main/master и CDN
        const sources = [
            `./${encoded}`,
            `https://raw.githubusercontent.com/${USER}/${REPO}/main/${encoded}`,
            `https://raw.githubusercontent.com/${USER}/${REPO}/master/${encoded}`,
            `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${encoded}`
        ];

        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = `Фото ${i}`;

        let attempt = 0;
        img.src = sources[attempt];

        img.onload = () => {
            img.classList.add('loaded');
        };

        img.onerror = () => {
            attempt++;
            if (attempt < sources.length) {
                img.src = sources[attempt];
            } else {
                // Если ни одна ссылка не сработала — убираем пустую карточку
                card.remove();
            }
        };

        card.onclick = () => {
            if (img.classList.contains('loaded')) {
                lightboxImg.src = img.src;
                lightbox.classList.add('open');
            }
        };

        card.appendChild(img);
        gallery.appendChild(card);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') lightbox.classList.remove('open');
    });
</script>
</body>
</html>
