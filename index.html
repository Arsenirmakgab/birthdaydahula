<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pink-1: #fff0f6;
            --bg-pink-2: #ffdeeb;
            --bg-pink-3: #fcc2d7;
            --surface: rgba(255, 255, 255, 0.68);
            --surface-border: rgba(255, 255, 255, 0.92);
            --text-main: #4a192c;
            --text-muted: #8a4a63;
            --accent: #e64980;
            --accent-deep: #c2255c;
            --accent-glow: rgba(230, 73, 128, 0.35);
            --soft-pink: #ff87ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(145deg, #fff5f8 0%, #ffe3ec 45%, #ffd0e0 100%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Живой нежно-розовый градиентный фон */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(95px);
            opacity: 0.65;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, #ff9ebb 0%, transparent 70%);
            top: -15%;
            left: -10%;
        }

        .orb-2 {
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, #f3a6d8 0%, transparent 70%);
            bottom: -15%;
            right: -10%;
            animation-delay: -6s;
        }

        .orb-3 {
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, #ffc2d1 0%, transparent 70%);
            top: 35%;
            left: 30%;
            animation-delay: -12s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(6%, 7%) scale(1.08); }
            100% { transform: translate(-5%, -5%) scale(0.95); }
        }

        /* Контейнер для летающих сердечек, цветочков и звёздочек */
        .floating-elements {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .floater {
            position: absolute;
            bottom: -60px;
            user-select: none;
            animation: riseUp linear infinite;
            filter: drop-shadow(0 4px 10px rgba(230, 73, 128, 0.2));
        }

        @keyframes riseUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            12% {
                opacity: var(--max-opacity, 0.75);
            }
            50% {
                transform: translateY(-52vh) translateX(var(--sway, 30px)) rotate(180deg) scale(1);
            }
            88% {
                opacity: var(--max-opacity, 0.75);
            }
            100% {
                transform: translateY(-112vh) translateX(calc(var(--sway, 30px) * -0.7)) rotate(360deg) scale(0.9);
                opacity: 0;
            }
        }

        /* Всплеск сердечек при клике */
        .click-spark {
            position: fixed;
            pointer-events: none;
            z-index: 3000;
            font-size: 1.2rem;
            animation: burstOut 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes burstOut {
            0% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--rot));
                opacity: 0;
            }
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            width: 0%;
            background: linear-gradient(90deg, #ff758f, #e64980, #f783ac);
            z-index: 1000;
            box-shadow: 0 2px 10px var(--accent-glow);
            transition: width 0.1s ease-out;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px 40px;
            position: relative;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(230, 73, 128, 0.25);
            color: var(--accent-deep);
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 26px;
            box-shadow: 0 8px 24px rgba(230, 73, 128, 0.12);
            animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(3.2rem, 8vw, 6.2rem);
            font-weight: 700;
            line-height: 0.98;
            letter-spacing: -0.02em;
            max-width: 900px;
            background: linear-gradient(135deg, #881337 10%, #d6336c 55%, #f06595 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 22px;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-muted);
            max-width: 560px;
            line-height: 1.65;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(32px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 24px 120px;
        }

        .chapter {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 32px;
            padding: 36px;
            margin-bottom: 68px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(214, 51, 108, 0.11);
            opacity: 0;
            transform: translateY(60px) scale(0.97);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.4s ease;
        }

        .chapter.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .chapter:hover {
            box-shadow: 0 26px 60px rgba(214, 51, 108, 0.18);
        }

        /* Декоративный уголок с цветочком на карточке главы */
        .chapter::after {
            content: '🌸';
            position: absolute;
            top: 24px;
            right: 28px;
            font-size: 1.4rem;
            opacity: 0.75;
            animation: gentleSpin 8s infinite ease-in-out;
        }

        @keyframes gentleSpin {
            0%, 100% { transform: rotate(-8deg) scale(1); }
            50% { transform: rotate(12deg) scale(1.12); }
        }

        .chapter-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 26px;
            padding-right: 36px;
            flex-wrap: wrap;
        }

        .chapter-num {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .chapter-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.8rem, 3.5vw, 2.55rem);
            font-weight: 700;
            color: #59142e;
            line-height: 1.15;
            margin-top: 4px;
        }

        .photos-grid {
            display: grid;
            gap: 22px;
            perspective: 1200px;
        }

        .photos-grid.cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .photos-grid.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .tilt-card {
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            aspect-ratio: 3 / 4;
            background: #ffe8f0;
            border: 4px solid #ffffff;
            cursor: zoom-in;
            transform-style: preserve-3d;
            transition: transform 0.25s cubic-bezier(0.03, 0.98, 0.52, 0.99),
                        box-shadow 0.3s ease;
            box-shadow: 0 12px 28px rgba(194, 37, 92, 0.14);
        }

        .tilt-card:hover {
            box-shadow: 0 22px 45px rgba(230, 73, 128, 0.28);
            z-index: 5;
        }

        .tilt-card .glare {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.45), transparent 65%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            mix-blend-mode: soft-light;
            z-index: 2;
        }

        .tilt-card:hover .glare {
            opacity: 1;
        }

        .tilt-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tilt-card img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .tilt-card:hover img.loaded {
            transform: scale(1.04);
        }

        .chapter-footer {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid rgba(230, 73, 128, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .chapter-quote {
            font-size: 1.05rem;
            color: #6e354b;
            font-style: italic;
            line-height: 1.5;
        }

        .chapter-heart {
            color: var(--accent);
            font-size: 1.3rem;
            flex-shrink: 0;
            animation: heartbeat 1.8s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.18); }
            60% { transform: scale(1); }
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(45, 12, 26, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.open {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 78vh;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
            border: 4px solid #ffffff;
            animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-caption {
            margin-top: 16px;
            text-align: center;
            color: #fff0f6;
            font-size: 1.05rem;
        }

        .lightbox-caption span {
            color: #ffc2d1;
            font-size: 0.88rem;
            display: block;
            margin-top: 4px;
        }

        .lb-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 2010;
        }

        .lb-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .lb-prev { left: 20px; }
        .lb-next { right: 20px; }

        .lb-close {
            position: fixed;
            top: 22px;
            right: 24px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 2010;
            transition: all 0.2s ease;
        }

        .lb-close:hover {
            background: var(--accent);
        }

        footer {
            text-align: center;
            padding: 30px 20px 60px;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        footer span {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .chapter {
                padding: 22px;
                margin-bottom: 44px;
                border-radius: 24px;
            }
            .photos-grid.cols-3 {
                grid-template-columns: repeat(2, 1fr);
            }
            .photos-grid.cols-3 .tilt-card:last-child {
                grid-column: span 2;
                aspect-ratio: 4 / 3;
            }
            .lb-btn {
                width: 40px;
                height: 40px;
            }
        }

        @media (max-width: 480px) {
            .photos-grid.cols-2,
            .photos-grid.cols-3 {
                grid-template-columns: 1fr;
            }
            .photos-grid.cols-3 .tilt-card:last-child {
                grid-column: span 1;
                aspect-ratio: 3 / 4;
            }
        }
    </style>
</head>

        function attachTiltEffect(card) {
            const glare = card.querySelector('.glare');
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = ((y - centerY) / centerY) * -7;
                const rotateY = ((x - centerX) / centerX) * 7;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                glare.style.background = `radial-gradient(circle at ${(x / rect.width) * 100}% ${(y / rect.height) * 100}%, rgba(255,255,255,0.45), transparent 65%)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            });
        }

        function createPhotoCard(photoNumber, sectionTitle, sectionText) {
            const rawName = `01 (${photoNumber}).jpg`;
            const rawNameUpper = `01 (${photoNumber}).JPG`;
            const encName = encodeURIComponent(rawName);
            const encNameUpper = encodeURIComponent(rawNameUpper);

            const sources = [
                rawName,
                rawNameUpper,
                `https://raw.githubusercontent.com/${USER}/${REPO}/main/${encName}`,
                `https://raw.githubusercontent.com/${USER}/${REPO}/main/${encNameUpper}`,
                `https://raw.githubusercontent.com/${USER}/${REPO}/master/${encName}`,
                `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@main/${encName}`
            ];

            const card = document.createElement('div');
            card.className = 'tilt-card';

            const glare = document.createElement('div');
            glare.className = 'glare';

            const img = document.createElement('img');
            img.loading = 'lazy';
            img.alt = sectionTitle;

            let attempt = 0;
            img.src = sources[attempt];

            img.onload = () => {
                img.classList.add('loaded');
                const entry = { src: img.src, title: sectionTitle, text: sectionText };
                const idx = loadedGallery.push(entry) - 1;
                card.onclick = () => openLightbox(idx);
            };

            img.onerror = () => {
                attempt++;
                if (attempt < sources.length) {
                    img.src = sources[attempt];
                } else {
                    card.remove();
                }
            };

            card.appendChild(glare);
            card.appendChild(img);
            attachTiltEffect(card);

            return card;
        }

        sections.forEach((sec, index) => {
            const chapterEl = document.createElement('article');
            chapterEl.className = 'chapter';

            const headerEl = document.createElement('div');
            headerEl.className = 'chapter-header';
            headerEl.innerHTML = `
                <div>
                    <div class="chapter-num">Глава ${String(index + 1).padStart(2, '0')}</div>
                    <h2 class="chapter-title">${sec.title}</h2>
                </div>
            `;

            const gridEl = document.createElement('div');
            gridEl.className = `photos-grid cols-${sec.ids.length === 2 ? '2' : '3'}`;

            sec.ids.forEach(num => {
                gridEl.appendChild(createPhotoCard(num, sec.title, sec.text));
            });

            const footerEl = document.createElement('div');
            footerEl.className = 'chapter-footer';
            footerEl.innerHTML = `
                <p class="chapter-quote">«${sec.text}»</p>
                <span class="chapter-heart">♥</span>
            `;

            chapterEl.appendChild(headerEl);
            chapterEl.appendChild(gridEl);
            chapterEl.appendChild(footerEl);
            storiesContainer.appendChild(chapterEl);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.chapter').forEach(ch => observer.observe(ch));

        const progressBar = document.getElementById('scrollProgress');
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            progressBar.style.width = `${progress}%`;
        }, { passive: true });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lbTitle = document.getElementById('lbTitle');
        const lbSub = document.getElementById('lbSub');

        function openLightbox(index) {
            if (!loadedGallery.length) return;
            currentLbIndex = (index + loadedGallery.length) % loadedGallery.length;
            const item = loadedGallery[currentLbIndex];
            lightboxImg.src = item.src;
            lbTitle.textContent = item.title;
            lbSub.textContent = item.text;
            lightbox.classList.add('open');
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
        }

        document.getElementById('lbClose').onclick = closeLightbox;
        document.getElementById('lbPrev').onclick = (e) => { e.stopPropagation(); openLightbox(currentLbIndex - 1); };
        document.getElementById('lbNext').onclick = (e) => { e.stopPropagation(); openLightbox(currentLbIndex + 1); };
        lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') openLightbox(currentLbIndex - 1);
            if (e.key === 'ArrowRight') openLightbox(currentLbIndex + 1);
        });
    </script>
</body>
</html>
